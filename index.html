<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accueil</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main class="page">
  <div class="hero">
    <div class="greeting-row">
      <span class="avatar-badge" id="avatar-badge" hidden></span>
      <h1 class="heading">
        <span id="greeting-text">Bonjour</span>
        <span class="greeting-emoji" id="greeting-emoji"></span>
      </h1>
    </div>

    <form class="search-card" id="search-form" autocomplete="off">
      <div class="input-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="" autofocus>
        <div class="fake-placeholder" id="fake-placeholder" aria-hidden="true">
          <span>Que voulez-vous&nbsp;</span>
          <span class="typed-word" id="typed-word"></span><span class="typed-cursor"></span>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <button type="button" class="engine-toggle" id="engine-toggle" aria-haspopup="listbox" aria-expanded="false">
            <span class="engine-icon" id="engine-icon"></span>
            <span id="engine-name">Google</span>
            <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ul class="engine-menu" id="engine-menu" role="listbox">
            <li role="option" data-engine="google">
              <span class="engine-icon">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=google.com" width="18" height="18" alt="">
              </span>
              <span>Google</span>
            </li>
            <li role="option" data-engine="bing">
              <span class="engine-icon">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=bing.com" width="18" height="18" alt="">
              </span>
              <span>Bing</span>
            </li>
            <li role="option" data-engine="duckduckgo">
              <span class="engine-icon">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=duckduckgo.com" width="18" height="18" alt="">
              </span>
              <span>DuckDuckGo</span>
            </li>
            <li role="option" data-engine="yahoo">
              <span class="engine-icon">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=yahoo.com" width="18" height="18" alt="">
              </span>
              <span>Yahoo</span>
            </li>
            <li role="option" data-engine="brave">
              <span class="engine-icon">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=brave.com" width="18" height="18" alt="">
              </span>
              <span>Brave</span>
            </li>
            <li role="option" data-engine="ecosia">
              <span class="engine-icon">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=ecosia.org" width="18" height="18" alt="">
              </span>
              <span>Ecosia</span>
            </li>
            <li role="option" data-engine="qwant">
              <span class="engine-icon">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=qwant.com" width="18" height="18" alt="">
              </span>
              <span>Qwant</span>
            </li>
          </ul>
        </div>

        <div class="toolbar-right">
          <button type="button" class="mic-button" id="mic-button" aria-label="Dictée vocale">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button type="submit" class="search-submit" aria-label="Rechercher">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </form>

    <div class="shortcuts">
      <a class="shortcut-tile" href="https://www.youtube.com" target="_blank" rel="noopener">
        <img src="https://www.google.com/s2/favicons?sz=64&domain=youtube.com" width="20" height="20" alt="">
        <span>YouTube</span>
      </a>
      <a class="shortcut-tile" href="https://mail.google.com" target="_blank" rel="noopener">
        <img src="https://www.google.com/s2/favicons?sz=64&domain=gmail.com" width="20" height="20" alt="">
        <span>Gmail</span>
      </a>
      <a class="shortcut-tile" href="https://github.com" target="_blank" rel="noopener">
        <img src="https://www.google.com/s2/favicons?sz=64&domain=github.com" width="20" height="20" alt="">
        <span>GitHub</span>
      </a>
      <a class="shortcut-tile" href="https://www.netflix.com" target="_blank" rel="noopener">
        <img src="https://www.google.com/s2/favicons?sz=64&domain=netflix.com" width="20" height="20" alt="">
        <span>Netflix</span>
      </a>
      <a class="shortcut-tile" href="https://twitter.com" target="_blank" rel="noopener">
        <img src="https://www.google.com/s2/favicons?sz=64&domain=x.com" width="20" height="20" alt="">
        <span>X</span>
      </a>
    </div>
  </div>
</main>

<button type="button" class="settings-toggle" id="settings-toggle" aria-label="Paramètres">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8.68637 4.00008L11.293 1.39348C11.6835 1.00295 12.3167 1.00295 12.7072 1.39348L15.3138 4.00008H19.0001C19.5524 4.00008 20.0001 4.4478 20.0001 5.00008V8.68637L22.6067 11.293C22.9972 11.6835 22.9972 12.3167 22.6067 12.7072L20.0001 15.3138V19.0001C20.0001 19.5524 19.5524 20.0001 19.0001 20.0001H15.3138L12.7072 22.6067C12.3167 22.9972 11.6835 22.9972 11.293 22.6067L8.68637 20.0001H5.00008C4.4478 20.0001 4.00008 19.5524 4.00008 19.0001V15.3138L1.39348 12.7072C1.00295 12.3167 1.00295 11.6835 1.39348 11.293L4.00008 8.68637V5.00008C4.00008 4.4478 4.4478 4.00008 5.00008 4.00008H8.68637ZM6.00008 6.00008V9.5148L3.5148 12.0001L6.00008 14.4854V18.0001H9.5148L12.0001 20.4854L14.4854 18.0001H18.0001V14.4854L20.4854 12.0001L18.0001 9.5148V6.00008H14.4854L12.0001 3.5148L9.5148 6.00008H6.00008ZM12.0001 16.0001C9.79094 16.0001 8.00008 14.2092 8.00008 12.0001C8.00008 9.79094 9.79094 8.00008 12.0001 8.00008C14.2092 8.00008 16.0001 9.79094 16.0001 12.0001C16.0001 14.2092 14.2092 16.0001 12.0001 16.0001ZM12.0001 14.0001C13.1047 14.0001 14.0001 13.1047 14.0001 12.0001C14.0001 10.8955 13.1047 10.0001 12.0001 10.0001C10.8955 10.0001 10.0001 10.8955 10.0001 12.0001C10.0001 13.1047 10.8955 14.0001 12.0001 14.0001Z"></path></svg>
</button>

<div class="settings-overlay" id="settings-overlay">
  <div class="settings-modal">
    <h2>Paramètres</h2>

    <div class="avatar-field">
      <button type="button" class="avatar-picker" id="avatar-picker" aria-label="Changer la photo de profil">
        <span class="avatar-placeholder" id="avatar-placeholder">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 20c1.6-3.6 4.8-5.5 8-5.5s6.4 1.9 8 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="avatar-edit-icon">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <path d="M4 16.5V20h3.5L18 9.5 14.5 6 4 16.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
      <div class="avatar-field-text">
        <p>Photo de profil</p>
        <button type="button" class="btn-link" id="avatar-remove">Retirer la photo</button>
      </div>
      <input type="file" id="avatar-input" accept="image/*" hidden>
    </div>

    <label for="pseudo-input">Votre pseudo</label>
    <input type="text" id="pseudo-input" placeholder="Ex. Anthony" maxlength="30">
    <p class="settings-error" id="avatar-error" hidden></p>

    <div class="settings-row">
      <label for="shortcuts-toggle" class="settings-row-label">Afficher les raccourcis</label>
      <label class="switch">
        <input type="checkbox" id="shortcuts-toggle" checked>
        <span class="switch-track"></span>
      </label>
    </div>

    <div class="settings-row">
      <p class="settings-row-label">Page d'accueil / nouvel onglet</p>
      <button type="button" class="btn-link" id="homepage-setup-btn">Comment faire ?</button>
    </div>
    <div class="homepage-instructions" id="homepage-instructions" hidden>
      <p class="homepage-instructions-browser" id="homepage-instructions-browser"></p>
      <ul class="homepage-instructions-list" id="homepage-instructions-list"></ul>
      <div class="homepage-instructions-actions">
        <button type="button" class="btn-copy" id="homepage-copy-url">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="2"/>
          </svg>
          Copier l'URL de cette page
        </button>
        <span class="settings-hint" id="homepage-copy-confirm" hidden>Copié !</span>
      </div>
    </div>

    <div class="settings-actions">
      <button type="button" class="btn-ghost" id="settings-cancel">Annuler</button>
      <button type="button" class="btn-primary" id="settings-save">Enregistrer</button>
    </div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
