<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accueil</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#131314">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <defs>
    <radialGradient id="engine-bing-a" cx="93.717%" cy="77.818%" fx="93.717%" fy="77.818%" gradientTransform="scale(-1 -.7146) rotate(49.288 2.035 -2.198)" r="143.691%">
      <stop offset="0%" stop-color="#00CACC"/><stop offset="100%" stop-color="#048FCE"/>
    </radialGradient>
    <radialGradient id="engine-bing-b" cx="13.893%" cy="71.448%" fx="13.893%" fy="71.448%" gradientTransform="scale(.6042 1) rotate(-23.34 .184 .494)" r="149.21%">

    </radialGradient>
    <linearGradient id="engine-bing-c" x1="50%" x2="50%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#00BBEC"/><stop offset="100%" stop-color="#2756A9"/>

    <linearGradient id="engine-brave-a" y1="51%" y2="51%">
      <stop offset=".4" stop-color="#f50"/><stop offset=".6" stop-color="#ff2000"/>

      <stop offset="0" stop-color="#ff452a"/><stop offset="1" stop-color="#ff2000"/>

    <radialGradient id="ai-copilot-0" cx="85.44%" cy="100.653%" fx="85.44%" fy="100.653%" gradientTransform="scale(-.8553 -1) rotate(50.927 2.041 -1.946)" r="105.116%">
      <stop offset="9.6%" stop-color="#00AEFF"/><stop offset="77.3%" stop-color="#2253CE"/><stop offset="100%" stop-color="#0736C4"/>

    <radialGradient id="ai-copilot-1" cx="18.143%" cy="32.928%" fx="18.143%" fy="32.928%" gradientTransform="scale(.8897 1) rotate(52.069 .193 .352)" r="95.612%">
      <stop offset="0%" stop-color="#FFB657"/><stop offset="63.4%" stop-color="#FF5F3D"/><stop offset="92.3%" stop-color="#C02B3C"/>

    <linearGradient id="ai-copilot-2" x1="39.465%" x2="46.884%" y1="12.117%" y2="103.774%">
      <stop offset="15.6%" stop-color="#0D91E1"/><stop offset="48.7%" stop-color="#52B471"/><stop offset="65.2%" stop-color="#98BD42"/><stop offset="93.7%" stop-color="#FFC800"/>

    <linearGradient id="ai-copilot-3" x1="45.949%" x2="50%" y1="0%" y2="100%">

    <radialGradient id="ai-copilot-4" cx="82.987%" cy="-9.792%" fx="82.987%" fy="-9.792%" gradientTransform="scale(-1 -.9441) rotate(-70.872 .142 1.17)" r="140.622%">
      <stop offset="6.6%" stop-color="#8C48FF"/><stop offset="50%" stop-color="#F2598A"/><stop offset="89.6%" stop-color="#FFB152"/>
    </radialGradient>
    <linearGradient id="ai-copilot-5" x1="83.507%" x2="83.453%" y1="-6.106%" y2="21.131%">
      <stop offset="5.8%" stop-color="#F8ADFA"/><stop offset="70.8%" stop-color="#A86EDD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ai-gemini-0" gradientUnits="userSpaceOnUse" x1="7" x2="11" y1="15.5" y2="12">
      <stop stop-color="#08B962"/><stop offset="1" stop-color="#08B962" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ai-gemini-1" gradientUnits="userSpaceOnUse" x1="8" x2="11.5" y1="5.5" y2="11">
      <stop stop-color="#F94543"/><stop offset="1" stop-color="#F94543" stop-opacity="0"/>

  </defs>
</svg>

<main class="page">
  <div class="hero">
    <h1 class="heading">
      <span id="hero-phrase"></span>
    </h1>

    <form class="search-card" id="search-form" autocomplete="off">
      <div class="input-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="" autofocus
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions-list" aria-haspopup="listbox">
        <div class="fake-placeholder" id="fake-placeholder" aria-hidden="true">
          <span>Que voulez-vous&nbsp;</span>
          <span class="typed-word" id="typed-word"></span><span class="typed-cursor"></span>
        </div>
      </div>

      <ul class="suggestions-list" id="suggestions-list" role="listbox"></ul>

      <div class="toolbar">
        <div class="toolbar-left">
          <button type="button" class="engine-toggle" id="engine-toggle" aria-haspopup="listbox" aria-expanded="false">
            <span class="engine-icon" id="engine-icon"></span>
            <span id="engine-name">Google</span>
            <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <span class="ai-button-wrap">
            <a class="ai-button" id="ai-button" href="https://chatgpt.com/" target="_blank" rel="noopener" aria-label="Ouvrir ChatGPT"></a>
            <button type="button" class="command-hint-button" id="command-hint-button" aria-label="Voir les commandes">/</button>
          </span>
        </div>

        <div class="toolbar-right">
          <button type="button" class="mic-button" id="mic-button" aria-label="Dictée vocale"></button>

          <button type="submit" class="search-submit" aria-label="Rechercher">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <ul class="engine-menu themed-scroll" id="engine-menu" role="listbox"></ul>
    </form>

    <div class="shortcuts-wrap" id="shortcuts-wrap">
      <div class="shortcuts-wrap-inner">
        <button type="button" class="shortcuts-nav shortcuts-nav-prev" id="shortcuts-prev" aria-label="Raccourcis précédents" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="shortcuts-viewport">
          <div class="shortcuts" id="shortcuts"></div>
        </div>
        <button type="button" class="shortcuts-nav shortcuts-nav-next" id="shortcuts-next" aria-label="Raccourcis suivants" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</main>

<button type="button" class="settings-toggle" id="settings-toggle" aria-label="Paramètres">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8.68637 4.00008L11.293 1.39348C11.6835 1.00295 12.3167 1.00295 12.7072 1.39348L15.3138 4.00008H19.0001C19.5524 4.00008 20.0001 4.4478 20.0001 5.00008V8.68637L22.6067 11.293C22.9972 11.6835 22.9972 12.3167 22.6067 12.7072L20.0001 15.3138V19.0001C20.0001 19.5524 19.5524 20.0001 19.0001 20.0001H15.3138L12.7072 22.6067C12.3167 22.9972 11.6835 22.9972 11.293 22.6067L8.68637 20.0001H5.00008C4.4478 20.0001 4.00008 19.5524 4.00008 19.0001V15.3138L1.39348 12.7072C1.00295 12.3167 1.00295 11.6835 1.39348 11.293L4.00008 8.68637V5.00008C4.00008 4.4478 4.4478 4.00008 5.00008 4.00008H8.68637ZM6.00008 6.00008V9.5148L3.5148 12.0001L6.00008 14.4854V18.0001H9.5148L12.0001 20.4854L14.4854 18.0001H18.0001V14.4854L20.4854 12.0001L18.0001 9.5148V6.00008H14.4854L12.0001 3.5148L9.5148 6.00008H6.00008ZM12.0001 16.0001C9.79094 16.0001 8.00008 14.2092 8.00008 12.0001C8.00008 9.79094 9.79094 8.00008 12.0001 8.00008C14.2092 8.00008 16.0001 9.79094 16.0001 12.0001C16.0001 14.2092 14.2092 16.0001 12.0001 16.0001ZM12.0001 14.0001C13.1047 14.0001 14.0001 13.1047 14.0001 12.0001C14.0001 10.8955 13.1047 10.0001 12.0001 10.0001C10.8955 10.0001 10.0001 10.8955 10.0001 12.0001C10.0001 13.1047 10.8955 14.0001 12.0001 14.0001Z"></path></svg>
</button>

<div class="settings-overlay" id="settings-overlay">
  <div class="settings-modal themed-scroll">
    <h2>Paramètres</h2>

    <div class="settings-section">
      <div class="settings-row">
        <label for="shortcuts-toggle" class="settings-row-label">Afficher les raccourcis</label>
        <label class="switch">
          <input type="checkbox" id="shortcuts-toggle">
          <span class="switch-track"></span>
        </label>
      </div>
    </div>

    <div class="settings-section" id="shortcuts-editor">
      <div class="shortcuts-editor-inner">
        <div class="settings-section-header settings-section-header-end">
          <button type="button" class="btn-link" id="shortcuts-add-btn">+ Ajouter</button>
        </div>
        <ul class="shortcuts-edit-list themed-scroll" id="shortcuts-edit-list"></ul>
        <input type="file" id="shortcut-icon-input" accept="image/*,.svg" hidden>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title-row">
        <p class="settings-section-title">Raccourcis IA</p>
        <button type="button" class="info-btn" aria-label="À quoi ça sert ?" data-tooltip="Ouvre juste la page d'accueil de l'IA choisie. Pour lancer une recherche directement avec une IA, sélectionne-la comme moteur dans le champ de recherche.">?</button>
      </div>
      <div class="ai-picker" id="ai-picker"></div>
    </div>

    <div class="settings-section">
      <div class="settings-section-header">
        <p class="settings-section-title">Page d'accueil / nouvel onglet</p>
        <button type="button" class="btn-link" id="homepage-setup-btn">Comment faire ?</button>
      </div>
      <div class="homepage-instructions" id="homepage-instructions" hidden>
        <div class="homepage-instructions-inner">
          <p class="homepage-instructions-browser" id="homepage-instructions-browser"></p>
          <ul class="homepage-instructions-list" id="homepage-instructions-list"></ul>
          <div class="homepage-instructions-actions">
            <button type="button" class="btn-copy" id="homepage-copy-url">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
                <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="2"/>
              </svg>
              Copier l'URL de cette page
            </button>
            <span class="settings-hint" id="homepage-copy-confirm" hidden>Copié !</span>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-header">
        <p class="settings-section-title">Commandes /</p>
        <button type="button" class="btn-link" id="commands-add-btn">+ Ajouter</button>
      </div>
      <ul class="commands-edit-list themed-scroll" id="commands-edit-list"></ul>
    </div>

    <div class="settings-section">
      <div class="settings-section-title-row">
        <p class="settings-section-title">Sauvegarde</p>
        <button type="button" class="info-btn" aria-label="Qu'est-ce que ça sauvegarde ?" data-tooltip="Exporte tes raccourcis, ton moteur/IA préféré, l'affichage des raccourcis et ton historique de recherche dans un fichier JSON, à réimporter plus tard ou sur un autre appareil. Rien n'est envoyé sur un serveur.">?</button>
      </div>
      <div class="backup-actions">
        <button type="button" class="btn-copy" id="backup-export-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Exporter
        </button>
        <button type="button" class="btn-copy" id="backup-import-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="M12 15V3m0 0l-4 4m4-4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Importer
        </button>
        <input type="file" id="backup-import-input" accept="application/json,.json" hidden>
        <span class="settings-hint" id="backup-confirm" hidden></span>
      </div>
    </div>

    <div class="settings-actions">
      <button type="button" class="btn-ghost" id="settings-cancel">Annuler</button>
      <button type="button" class="btn-primary" id="settings-save">Enregistrer</button>
    </div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
