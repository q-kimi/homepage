<main class="page">
  <div class="hero">
    <h1 class="heading">
      <span id="hero-phrase"></span>
    </h1>

    <form class="search-card" id="search-form" autocomplete="off">
      <div class="input-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="" autofocus
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions-list" aria-haspopup="listbox">
        <div class="fake-placeholder" id="fake-placeholder" aria-hidden="true">
          <span>Que voulez-vous&nbsp;</span>
          <span class="typed-word" id="typed-word"></span><span class="typed-cursor"></span>
        </div>
      </div>

      <ul class="suggestions-list" id="suggestions-list" role="listbox"></ul>

      <div class="toolbar">
        <div class="toolbar-left">
          <button type="button" class="engine-toggle" id="engine-toggle" aria-haspopup="listbox" aria-expanded="false">
            <span class="engine-icon" id="engine-icon"></span>
            <span id="engine-name">Google</span>
            <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ul class="engine-menu" id="engine-menu" role="listbox">
            <li role="option" data-engine="google">
              <span class="engine-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/960px-Google_Favicon_2025.svg.png" width="18" height="18" alt="">
              </span>
              <span>Google</span>
            </li>
            <li role="option" data-engine="bing">
              <span class="engine-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M11.97 7.569a.92.92 0 00-.805.863c-.013.195-.01.209.43 1.347 1 2.59 1.242 3.214 1.283 3.302.099.213.237.413.41.592.134.138.222.212.37.311.26.176.39.224 1.405.527.989.295 1.529.49 1.994.723.603.302 1.024.644 1.29 1.051.191.292.36.815.434 1.342.029.206.029.661 0 .847a2.491 2.491 0 01-.376 1.026c-.1.151-.065.126.081-.058.415-.52.838-1.408 1.054-2.213a6.728 6.728 0 00.102-3.012 6.626 6.626 0 00-3.291-4.53 104.157 104.157 0 00-1.322-.698l-.254-.133a737.941 737.941 0 01-1.575-.827c-.548-.29-.78-.406-.846-.426a1.376 1.376 0 00-.29-.045l-.093.01z" fill="url(#engine-bing-a)"/>

              </span>
              <span>Brave</span>
            </li>
          </ul>

          <a class="ai-button" id="ai-button" href="https://claude.ai/new" target="_blank" rel="noopener" aria-label="Ouvrir Claude"></a>
        </div>

        <div class="toolbar-right">
          <button type="button" class="mic-button" id="mic-button" aria-label="Dictée vocale"></button>

          <button type="submit" class="search-submit" aria-label="Rechercher">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </form>

    <div class="shortcuts-wrap" id="shortcuts-wrap">
      <button type="button" class="shortcuts-nav shortcuts-nav-prev" id="shortcuts-prev" aria-label="Raccourcis précédents" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="shortcuts-viewport">
        <div class="shortcuts" id="shortcuts"></div>
      </div>
      <button type="button" class="shortcuts-nav shortcuts-nav-next" id="shortcuts-next" aria-label="Raccourcis suivants" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</main>

<button type="button" class="settings-toggle" id="settings-toggle" aria-label="Paramètres">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8.68637 4.00008L11.293 1.39348C11.6835 1.00295 12.3167 1.00295 12.7072 1.39348L15.3138 4.00008H19.0001C19.5524 4.00008 20.0001 4.4478 20.0001 5.00008V8.68637L22.6067 11.293C22.9972 11.6835 22.9972 12.3167 22.6067 12.7072L20.0001 15.3138V19.0001C20.0001 19.5524 19.5524 20.0001 19.0001 20.0001H15.3138L12.7072 22.6067C12.3167 22.9972 11.6835 22.9972 11.293 22.6067L8.68637 20.0001H5.00008C4.4478 20.0001 4.00008 19.5524 4.00008 19.0001V15.3138L1.39348 12.7072C1.00295 12.3167 1.00295 11.6835 1.39348 11.293L4.00008 8.68637V5.00008C4.00008 4.4478 4.4478 4.00008 5.00008 4.00008H8.68637ZM6.00008 6.00008V9.5148L3.5148 12.0001L6.00008 14.4854V18.0001H9.5148L12.0001 20.4854L14.4854 18.0001H18.0001V14.4854L20.4854 12.0001L18.0001 9.5148V6.00008H14.4854L12.0001 3.5148L9.5148 6.00008H6.00008ZM12.0001 16.0001C9.79094 16.0001 8.00008 14.2092 8.00008 12.0001C8.00008 9.79094 9.79094 8.00008 12.0001 8.00008C14.2092 8.00008 16.0001 9.79094 16.0001 12.0001C16.0001 14.2092 14.2092 16.0001 12.0001 16.0001ZM12.0001 14.0001C13.1047 14.0001 14.0001 13.1047 14.0001 12.0001C14.0001 10.8955 13.1047 10.0001 12.0001 10.0001C10.8955 10.0001 10.0001 10.8955 10.0001 12.0001C10.0001 13.1047 10.8955 14.0001 12.0001 14.0001Z"></path></svg>
</button>

<div class="settings-overlay" id="settings-overlay">
  <div class="settings-modal">
    <h2>Paramètres</h2>

    <div class="settings-row">
      <label for="shortcuts-toggle" class="settings-row-label">Afficher les raccourcis</label>
      <label class="switch">
        <input type="checkbox" id="shortcuts-toggle">
        <span class="switch-track"></span>
      </label>
    </div>

    <div class="settings-row">
      <p class="settings-row-label">Raccourcis IA</p>
    </div>
    <div class="ai-picker" id="ai-picker"></div>

    <div id="shortcuts-editor">
      <div class="settings-row">
        <p class="settings-row-label">Raccourcis</p>
        <button type="button" class="btn-link" id="shortcuts-add-btn">+ Ajouter</button>
      </div>
      <ul class="shortcuts-edit-list" id="shortcuts-edit-list"></ul>
    </div>

    <div class="settings-row">
      <p class="settings-row-label">Page d'accueil / nouvel onglet</p>
      <button type="button" class="btn-link" id="homepage-setup-btn">Comment faire ?</button>
    </div>
    <div class="homepage-instructions" id="homepage-instructions" hidden>
      <p class="homepage-instructions-browser" id="homepage-instructions-browser"></p>
      <ul class="homepage-instructions-list" id="homepage-instructions-list"></ul>
      <div class="homepage-instructions-actions">
        <button type="button" class="btn-copy" id="homepage-copy-url">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="2"/>
          </svg>
          Copier l'URL de cette page
        </button>
        <span class="settings-hint" id="homepage-copy-confirm" hidden>Copié !</span>
      </div>
    </div>

    <div class="settings-actions">
      <button type="button" class="btn-ghost" id="settings-cancel">Annuler</button>
      <button type="button" class="btn-primary" id="settings-save">Enregistrer</button>
    </div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
